[project]
name = "ghostintel"
version = "0.1.0"
description = "Autonomous Company Intelligence and Knowledge Graph System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "crawl4ai>=0.4.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "networkx>=3.4.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.18",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ghostintel = "ghostintel.main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
